[project]
name = "smis"
version = "1.0.0"
description = "Web-Based School Management System for Paquito S. Yu Memorial NHS"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.1,<5.2",
    "python-decouple>=3.8",
    "Pillow>=10.0",
    "whitenoise>=6.0",
    "dj-database-url>=2.0",
    "psycopg2-binary>=2.9",
    "django-shortcuts>=1.6",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "accounts", "students", "academics", "grades", "reports", "form137", "dashboard", "templates"]

[dependency-groups]
dev = [
    "black",
    "ruff",
    "hypothesis==6.135.26",
    "hypothesis[django]==6.135.26",
    # MySQL driver for local dev against XAMPP (DB_ENGINE=mysql).
    # Windows-only wheels, and never installed in production (Postgres),
    # so it is kept out of requirements.txt and gated on sys_platform.
    "mysqlclient>=2.2; sys_platform == 'win32'",
]
