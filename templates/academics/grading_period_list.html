{% extends 'base.html' %}
{% block title %}Grading Periods{% endblock %}
{% block page_title %}Grading Periods{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold">Grading Periods</h1>
        <div class="flex items-center gap-2">
            <a href="{% url 'academics:school_year_list' %}" class="px-4 py-2 rounded-lg border border-gray-200 dark:border-slate-700 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-slate-700 transition text-sm">School Years</a>
            <button onclick="window.dispatchEvent(new CustomEvent('open-modal', { detail: { url: '{% url 'academics:grading_period_create' %}' } }))" class="bg-primary hover:bg-blue-800 text-white px-4 py-2 rounded-lg transition">Add Grading Period</button>
        </div>
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-100 dark:border-slate-700">
        <div class="overflow-x-auto">
            {% include 'academics/partials/grading_period_table.html' %}
        </div>
    </div>
</div>
{% endblock %}
