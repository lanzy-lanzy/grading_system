<div class="p-6 text-center">
    <div class="w-12 h-12 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
    </div>
    <h3 class="text-lg font-semibold mb-2">Delete {{ title }}</h3>
    <p class="text-gray-500 mb-6">Are you sure you want to delete this assignment? This action cannot be undone.</p>
    <div class="flex gap-3 justify-center">
        <form method="post" hx-post="{{ request.path }}" hx-target="#modal-content" hx-swap="innerHTML">
            {% csrf_token %}
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg transition">Delete</button>
        </form>
        <button onclick="closeModal()" class="px-6 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-slate-700 transition">Cancel</button>
    </div>
</div>
