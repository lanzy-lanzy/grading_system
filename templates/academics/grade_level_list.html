{% extends 'base.html' %}
{% block title %}Grade Levels{% endblock %}
{% block page_title %}Grade Levels{% endblock %}
{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold">Grade Levels</h1>
        <button onclick="window.dispatchEvent(new CustomEvent('open-modal', { detail: { url: '{% url 'academics:grade_level_create' %}' } }))" class="bg-primary hover:bg-blue-800 text-white px-4 py-2 rounded-lg transition">Add Grade Level</button>
    </div>
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-100 dark:border-slate-700">
        <div class="overflow-x-auto">
            {% include 'academics/partials/grade_level_table.html' %}
        </div>
    </div>
</div>
{% endblock %}
