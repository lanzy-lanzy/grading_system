{% extends 'base.html' %}
{% block title %}Bulk Generate Form 137{% endblock %}
{% block page_title %}Bulk Generate Form 137{% endblock %}
{% block content %}
<div class="max-w-2xl">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 p-6">
        <p class="text-sm text-gray-500 mb-6">Generate Form 137 for all students with validated grades in a school year.</p>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium mb-1">School Year</label>
                <select name="school_year" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 dark:text-white">
                    {% for sy in school_years %}
                    <option value="{{ sy.id }}">{{ sy.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="flex gap-3 pt-4 border-t">
                <button type="submit" class="bg-primary hover:bg-blue-800 text-white px-6 py-2 rounded-lg transition">Generate All</button>
                <a href="{% url 'form137:form137_list' %}" class="px-6 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-slate-700 transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
