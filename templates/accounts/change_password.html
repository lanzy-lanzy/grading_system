{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}
{% block content %}
<div class="max-w-md">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-100 dark:border-slate-700 p-6">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
            <div class="flex gap-3 pt-4 border-t">
                <button type="submit" class="bg-primary hover:bg-blue-800 text-white px-6 py-2 rounded-lg transition">Change Password</button>
                <a href="{% url 'accounts:profile' %}" class="px-6 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-slate-700 transition">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
